<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Microsoft YaHei UI","Segoe UI",sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1,h2,p{margin:0}h1{font-size:29px;letter-spacing:-.6px}h2{font-size:17px;margin-bottom:14px}header{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}.source{margin-top:8px;color:var(--muted);overflow-wrap:anywhere}.unit{font-size:12px;color:var(--muted);margin-top:8px}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:20px 0}.filters label{display:grid;gap:5px;font-size:12px;color:var(--muted)}select,input,button{font:inherit}select,input{background:white;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%;min-width:120px}input{min-width:200px}button{cursor:pointer}.reset{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 14px;border-radius:6px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:white;padding:18px 20px;border-radius:10px;border:1px solid var(--line)}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.35;margin:7px 0}.stat .sub{font-size:12px;color:var(--muted)}.stat.net{background:#193f59;color:white;border:0}.stat.net .label,.stat.net .sub{color:#d4e3ef}.positive{color:var(--green)}.negative{color:var(--red)}.panel{background:white;border:1px solid var(--line);padding:22px;border-radius:10px;margin-bottom:20px;min-width:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.flow-item strong{font-size:22px;display:block;font-variant-numeric:tabular-nums}.flow-item .track{height:8px;background:#edf2f5;margin-top:9px}.track i{height:100%;display:block}.flow-item span{font-size:12px;color:var(--muted)}.bar-list{display:grid;gap:11px}.rank{display:grid;grid-template-columns:minmax(135px,1fr) 1fr 105px;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:5px 0;color:var(--ink);width:100%;border-radius:4px}.rank:hover,.rank:focus-visible{background:#f1f5f8}.rank .name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rank small{display:block;color:var(--muted);font-size:11px}.rank .lane{height:13px;position:relative;background:linear-gradient(to right,transparent calc(50% - .5px),#c3d0da calc(50% - .5px),#c3d0da calc(50% + .5px),transparent calc(50% + .5px))}.rank .mark{position:absolute;height:100%;border-radius:2px}.rank .amount{text-align:right;font-variant-numeric:tabular-nums}.hint,.empty{font-size:12px;color:var(--muted);margin-top:12px}.month{display:grid;grid-template-columns:95px 1fr 98px;gap:12px;align-items:center;margin-bottom:16px}.month .bars{display:grid;gap:4px}.month .bars i{display:block;height:10px;min-width:1px;border-radius:2px}.month .delta{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}.month .period{font-size:12px}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:12px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px}.table-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.table-head label{font-size:12px;color:var(--muted)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #e6edf2;text-align:left;white-space:nowrap}th{font-size:12px;color:var(--muted);font-weight:500;background:#f7f9fb}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr:hover{background:#f3f7fa}.customer-button{border:0;background:transparent;color:var(--blue);padding:0;text-align:left;font-weight:600}.tag{font-size:11px;border-radius:4px;padding:3px 6px;background:#edf2f6;white-space:nowrap}.tag.increase,.tag.added{background:#e5f3ec;color:var(--green)}.tag.decrease,.tag.removed{background:#faeae5;color:var(--red)}.tag.rescheduled{background:#fbf1d8;color:#7a5a12}.selection{border-top:4px solid var(--blue)}.selection .before{background:#f0f4f7}.selection .after{background:#eaf3f9}.selection .head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:16px}.selection .head h2{margin:0}.selection td{white-space:pre-wrap;overflow-wrap:anywhere}.selection .row-note{font-size:12px;color:var(--muted);margin-bottom:12px}.empty{padding:20px 0}details{margin-top:12px}summary{cursor:pointer;color:var(--muted);font-size:13px;padding:7px 0}.method{color:var(--muted);font-size:12px;margin:12px 0}#notes td{white-space:normal}.warning{color:var(--red);font-size:12px;margin-top:10px}footer{font-size:12px;color:var(--muted);margin:20px 0}.noscript{padding:20px;background:#fff0dc}
main{max-width:1600px;padding:24px}header{margin-bottom:12px}.filters{margin:12px 0}.source{margin-top:5px}.stats{margin-bottom:16px}.stat{padding:14px 18px}.rank{padding:8px 0;grid-template-columns:minmax(150px,1fr) 1fr 120px}.rank .name{font-size:15px}.rank small{font-size:12px}.rank .lane{height:16px}.rank .amount{font-size:15px}.month{margin-bottom:22px;grid-template-columns:105px 1fr 108px}.month .period,.month .delta{font-size:14px}.month .bars i{height:13px}.data-scroll{max-height:640px;overflow:auto}.data-scroll th{position:sticky;top:0;z-index:1}.data-scroll table{font-size:14px}.data-scroll td{padding-top:13px;padding-bottom:13px}
@media(max-width:1050px){main{padding:22px}.two{grid-template-columns:1fr}.stats .stat strong{font-size:23px}.rank{grid-template-columns:minmax(130px,1fr) 1fr 110px}}
@media(max-width:600px){main{padding:14px}.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat strong{font-size:20px!important}.flow{gap:12px}.flow-item strong{font-size:17px}.panel{padding:16px}header{display:block}.filters label{flex:1;min-width:130px}select,input{min-width:0;width:100%}.rank{grid-template-columns:minmax(100px,1fr) 1fr 90px;gap:5px}.month{grid-template-columns:80px 1fr 88px;gap:6px}}
@media print{body{background:white}main{padding:0;max-width:none}.filters,.reset,.customer-button+button{display:none}.panel,.stat{break-inside:avoid}.two{display:block}.rank{break-inside:avoid}}
</style></head><body><main>
<header><div><div class="eyebrow">DIAM / WEEKLY REVIEW</div><h1 id="heading"></h1><p class="source" id="source"></p><p class="unit" id="unit"></p></div><p class="unit" id="version"></p></header>
<div class="filters" id="filters"></div>
<section class="stats" id="stats" aria-live="polite"></section>
<section class="panel"><h2 id="flowTitle"></h2><div class="flow" id="flow"></div><p class="warning" id="incomplete" hidden></p></section>
<div class="two"><section class="panel"><h2 id="rankingTitle"></h2><div class="bar-list" id="ranking"></div><p class="hint" id="rankHint"></p></section><section class="panel"><h2 id="monthsTitle"></h2><div id="months"></div><div class="legend" id="legend"></div><p class="hint" id="monthHint"></p></section></div>
<section class="panel selection" id="selection" hidden aria-live="polite"></section>
<section class="panel"><div class="table-head"><h2 id="listTitle"></h2><label id="kindLabel"></label></div><div class="scroll data-scroll"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><p class="hint" id="count"></p></section>
<details class="panel"><summary id="notesTitle"></summary><div class="scroll"><table id="notes"></table></div></details>
<details><summary id="methodTitle"></summary><p class="method" id="scope"></p><p class="method" id="precision"></p><p class="method" id="referenceNote"></p></details>
<footer id="footer"></footer><noscript><p class="noscript">Please enable JavaScript to view this local interactive report. / 请启用 JavaScript 查看本地交互报告。</p></noscript>
</main><script type="application/json" id="report-data">__REPORT_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('report-data').textContent),t=data.copy,$=id=>document.getElementById(id);
const fmt=n=>n===null||n===undefined?'∅':new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const signed=n=>n===null?'∅':(n>0?'+':'')+fmt(n), business=r=>!['unchanged','reference'].includes(r.kind);
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;};
const state={team:'',entity:'',salesType:'',search:'',kind:'allChanges',sort:'absolute'};
const allKinds=['allChanges','increase','decrease','rescheduled','added','removed','modified','unchanged','allRows'];
function makeSelect(key,values,container,labelKey=key){const label=el('label',t[labelKey]),select=el('select');select.id=key;for(const [value,text] of values){const option=el('option',text);option.value=value;select.append(option);}label.append(select);container.append(label);return select;}
for(const [key,index] of [['team',0],['entity',1],['salesType',2]]){const values=[...new Set(data.rows.map(r=>r.identity[index]))].sort();const select=makeSelect(key,[['',t.all],...values.map(v=>[v,v])],$('filters'));select.addEventListener('change',()=>{state[key]=select.value;render();});}
const searchLabel=el('label',t.search),search=el('input');search.id='search';search.type='search';searchLabel.append(search);$('filters').append(searchLabel);search.addEventListener('input',()=>{state.search=search.value.trim().toLocaleLowerCase();render();});
const reset=el('button',t.reset,'reset');reset.addEventListener('click',()=>{for(const key of ['team','entity','salesType','search']){state[key]='';$(key).value='';}state.kind='allChanges';$('kind').value='allChanges';render();});$('filters').append(reset);
const kindSelect=makeSelect('kind',allKinds.map(k=>[k,t['kind.'+k]]),$('kindLabel'),'detailKind');kindSelect.addEventListener('change',()=>{state.kind=kindSelect.value;renderTable(scopeRows());});
function scopeRows(){return data.rows.filter(r=>(!state.team||r.identity[0]===state.team)&&(!state.entity||r.identity[1]===state.entity)&&(!state.salesType||r.identity[2]===state.salesType)&&r.identity.join(' ').toLocaleLowerCase().includes(state.search));}
function total(rows,side,column,monthly=false){let sum=0,populated=0;for(const r of rows){const rec=r[side];if(!rec)continue;if(rec.missing.includes(column))return null;const n=rec.numbers[column];if(n===null){if(monthly&&rec.values[column]===null)continue;return null;}sum+=n;populated++;}return populated||!monthly?sum:null;}
function card(label,value,sub,cls=''){const box=el('div',undefined,'stat '+cls);box.append(el('div',label,'label'),el('strong',value),el('div',sub,'sub'));return box;}
function render(){const rows=scopeRows(),old=total(rows,'old',22),current=total(rows,'new',22),net=old===null||current===null?null:current-old,changes=rows.filter(business),pos=rows.reduce((s,r)=>s+(r.delta>0?r.delta:0),0),neg=rows.reduce((s,r)=>s+(r.delta<0?r.delta:0),0);$('selection').hidden=true;
 const pct=old!==null&&old!==0&&net!==null?(net>0?'+':'')+(net/old*100).toFixed(2)+'%':'—';
 $('stats').replaceChildren(card(t.oldFcst,fmt(old),data.old.file),card(t.newFcst,fmt(current),data.new.file),card(t.netChange,signed(net),pct,'net'),card(t.changedRecords,String(changes.length),`${t.added} ${rows.filter(r=>r.kind==='added').length} / ${t.removed} ${rows.filter(r=>r.kind==='removed').length} / ${t.rescheduled} ${rows.filter(r=>r.kind==='rescheduled').length}`));
 $('flow').replaceChildren();const max=Math.max(pos,Math.abs(neg),Math.abs(net||0),1);for(const [label,value,color] of [[t.knownIncrease,pos,'var(--green)'],[t.knownDecrease,neg,'var(--red)'],[t.netChange,net,'var(--blue)']]){const box=el('div',undefined,'flow-item'),track=el('div',undefined,'track'),mark=el('i');mark.style.width=(Math.abs(value||0)/max*100)+'%';mark.style.background=color;track.append(mark);box.append(el('span',label),el('strong',signed(value)),track);$('flow').append(box);}
 $('incomplete').hidden=!rows.some(r=>r.delta===null);$('incomplete').textContent=t.incomplete;
 renderRanking(rows);renderMonths(rows);renderTable(rows);
}
function renderRanking(rows){const ranks=rows.filter(r=>r.delta!==null&&Math.abs(r.delta)>1e-6).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,8),target=$('ranking');target.replaceChildren();if(!ranks.length){target.append(el('p',t.emptyRanking,'empty'));return;}const max=Math.max(...ranks.map(r=>Math.abs(r.delta)));for(const row of ranks){const button=el('button',undefined,'rank'),name=el('span',row.identity[3],'name');name.append(el('small',row.identity[1]+' / '+row.identity[0]));const lane=el('span',undefined,'lane'),mark=el('i',undefined,'mark'),width=Math.abs(row.delta)/max*48;mark.style.width=width+'%';mark.style.left=(row.delta>=0?50:50-width)+'%';mark.style.background=row.delta>=0?'var(--green)':'var(--red)';lane.append(mark);button.append(name,lane,el('span',signed(row.delta),'amount '+(row.delta>=0?'positive':'negative')));button.title=row.identity.join(' / ')+' : '+signed(row.delta);button.addEventListener('click',()=>showDetail(row));target.append(button);}}
function renderMonths(rows){const months=[];for(let c=11;c<22;c++){const a=total(rows,'old',c,true),b=total(rows,'new',c,true);if((a===null&&b===null)||(a!==null&&b!==null&&Math.abs(b-a)<1e-6))continue;months.push({c,a,b});}const target=$('months');target.replaceChildren();if(!months.length){target.append(el('p',t.noMonthChanges,'empty'));return;}const max=Math.max(...months.flatMap(m=>[Math.abs(m.a||0),Math.abs(m.b||0)]),1);for(const m of months){const row=el('div',undefined,'month'),bars=el('div',undefined,'bars');for(const [value,color,side] of [[m.a,'var(--old)',t.old],[m.b,'var(--blue)',t.new]]){const bar=el('i');bar.style.width=(Math.abs(value||0)/max*100)+'%';bar.style.background=color;bar.style.visibility=value===null?'hidden':'visible';bar.title=side+': '+fmt(value);bars.append(bar);}const delta=m.a!==null&&m.b!==null?m.b-m.a:null;row.append(el('span',data.headers[m.c],'period'),bars,el('span',signed(delta),'delta '+(delta>=0?'positive':'negative')));target.append(row);}}
function renderTable(rows){const filtered=rows.filter(r=>state.kind==='allRows'||(state.kind==='allChanges'?business(r):state.kind==='unchanged'?!business(r):r.kind===state.kind));filtered.sort((a,b)=>state.sort==='name'?a.identity[3].localeCompare(b.identity[3]):Math.abs(b.delta||0)-Math.abs(a.delta||0));$('tableBody').replaceChildren();for(const r of filtered){const row=el('tr'),button=el('button',r.identity[3],'customer-button');button.addEventListener('click',()=>showDetail(r));const name=el('td');name.append(button);const kind=el('td');kind.append(el('span',t['kind.'+(r.kind==='reference'?'unchanged':r.kind)],'tag '+r.kind));row.append(name,el('td',r.identity[1]),el('td',r.identity[0]),kind,el('td',r.old?fmt(r.old.numbers[22]):'∅','num'),el('td',r.new?fmt(r.new.numbers[22]):'∅','num'),el('td',signed(r.delta),'num '+(r.delta>=0?'positive':'negative')));$('tableBody').append(row);}$('count').textContent=filtered.length+' '+t.showing;}
function showDetail(r){const target=$('selection');target.replaceChildren();target.hidden=false;const head=el('div',undefined,'head'),close=el('button',t.close,'reset');close.addEventListener('click',()=>target.hidden=true);head.append(el('h2',r.identity[3]+' / '+r.identity[1]),close);target.append(head,el('p',`${t.old}: ${r.old?r.old.row:'∅'} → ${t.new}: ${r.new?r.new.row:'∅'} (${t.sourceEvidence})`,'row-note'));
 const before=r.old?r.old.values[22]:null,after=r.new?r.new.values[22]:null;target.append(el('p',`${t.oldFcst} ${before===null?'∅':fmt(Number(before))} → ${t.newFcst} ${after===null?'∅':fmt(Number(after))}    ${t.delta} ${signed(r.delta)}`));
 const table=el('table'),header=el('tr');for(const key of ['field','oldValue','newValue','delta'])header.append(el('th',t[key]));table.append(header);
 const cols=r.old&&r.new?r.fields:Array.from({length:24},(_,c)=>c).filter(c=>(r.new||r.old).values[c]!==null);
 for(const c of cols){const row=el('tr'),a=r.old?r.old.values[c]:null,b=r.new?r.new.values[c]:null,an=r.old?r.old.numbers[c]:null,bn=r.new?r.new.numbers[c]:null;row.append(el('td',String.fromCharCode(65+c)+' / '+data.headers[c]),el('td',a===null?'∅':a,'before'),el('td',b===null?'∅':b,'after'),el('td',an!==null&&bn!==null?signed(bn-an):'—','num'));table.append(row);}if(!cols.length)target.append(el('p',t.noRows,'hint'));else{const wrapper=el('div',undefined,'scroll');wrapper.append(table);target.append(wrapper);}target.scrollIntoView({behavior:'smooth',block:'nearest'});
}
for(const id of ['flowTitle','rankingTitle','monthsTitle','scope','precision','referenceNote'])$(id).textContent=t[id];$('heading').textContent=t.visualTitle;$('source').textContent=data.old.file+'  →  '+data.new.file+' / '+data.new.sheet;$('unit').textContent=t.unitNote;$('version').textContent='v'+data.version;$('rankHint').textContent=t.chartHint;$('monthHint').textContent=t.monthNote;$('listTitle').textContent=t.changes;$('footer').textContent=t.visualHint;$('methodTitle').textContent=t.scope.split('.')[0];
for(const [label,color] of [[t.old,'var(--old)'],[t.new,'var(--blue)']]){const item=el('span'),mark=el('i');mark.style.background=color;item.append(mark,document.createTextNode(label));$('legend').append(item);}
const head=el('tr');for(const [key,num] of [['customer',false],['entity',false],['team',false],['kind',false],['oldFcst',true],['newFcst',true],['delta',true]]){const th=el('th',t[key],num?'num':'');head.append(th);if(key==='delta'||key==='customer'){th.style.cursor='pointer';th.addEventListener('click',()=>{state.sort=key==='customer'?'name':'absolute';renderTable(scopeRows());});}}$('tableHead').append(head);
$('notesTitle').textContent=t.issues+' ('+data.issues.length+')';for(const issue of data.issues){const row=el('tr');for(const value of [issue.side,issue.cell,issue.message,issue.detail])row.append(el('td',value));$('notes').append(row);}render();
</script></body></html>
