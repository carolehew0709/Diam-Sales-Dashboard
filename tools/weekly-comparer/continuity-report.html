function selectProject(p,index=p.observations.length-1,scroll=true){chosen=p;detailStep=Math.max(160,($('detail').clientWidth-44)/Math.max(1,p.observations.length));$('detailTitle').textContent=p.job+' / '+p.project;const track=el('div',undefined,'status-track');for(let i=0;i<p.observations.length;i++){const o=p.observations[i],box=el('div',undefined,'week-item'),button=el('button',observationText(o),'week-button');button.style.background=color(o);box.style.width=(detailStep-8)+'px';box.style.minWidth=(detailStep-8)+'px';button.addEventListener('click',()=>showSource(p,i));box.append(el('small',o.period),button);track.append(box);}$('statusTrack').replaceChildren(track);$('trends').replaceChildren();for(const currency of currencies){const section=el('div');section.append(el('h2',currency));const wrap=el('div',undefined,'trend-wrap');wrap.append(trend(p,currency));section.append(wrap);$('trends').append(section);}const dates=el('div',undefined,'date-track');for(const o of p.observations){const box=el('div',undefined,'week-item');box.style.width=(detailStep-8)+'px';box.style.minWidth=(detailStep-8)+'px';box.append(el('small',o.period),el('span',o.kind==='present'?o.invoice:t[o.kind]));dates.append(box);}$('dateTrack').replaceChildren(el('h2',t.invoice),dates);showSource(p,index);syncTracks();if(scroll)$('detail').scrollIntoView({behavior:'smooth',block:'start'});}

function showSource(p,index){const o=p.observations[index],target=$('source');target.replaceChildren();target.append(el('p',o.period+' / '+(o.kind==='present'?t.source:t[o.kind]),'history-source'));if(o.snapshot)target.append(el('p',o.snapshot.filename+' / '+o.snapshot.sha256,'small-note history-source'));const wrap=el('div',undefined,'scroll'),table=el('table',undefined,'source-table'),head=el('tr');for(const key of ['row','team','brand','status','invoice','RMB','USD','EUR'])head.append(el('th',t[key]||key));table.append(head);for(const r of o.rows){const row=el('tr');for(const value of [r.row,r.values[3],r.values[6],r.values[11],r.values[19],r.values[13],r.values[14],r.values[15]])row.append(el('td',value===null?'∅':String(value)));table.append(row);}wrap.append(table);target.append(wrap);}
function syncTracks(){const tracks=[...document.querySelectorAll('#detail .timeline-scroll,#detail .trend-wrap')];let syncing=false;for(const track of tracks)track.onscroll=()=>{if(syncing)return;syncing=true;for(const other of tracks)if(other!==track&&Math.abs(other.scrollLeft-track.scrollLeft)>1)other.scrollLeft=track.scrollLeft;syncing=false;};}
function csvCell(value){const numeric=value&&typeof value==='object'&&value.numeric;let s=numeric?value.value:value===null||value===undefined?'':String(value);if(!numeric&&typeof value==='string'&&/^[=+@\-\t\r\n]/.test(s.trimStart()))s="'"+s;return'"'+s.replace(/"/g,'""')+'"';}
$('download').addEventListener('click',()=>{const rows=[[t.team,t.brand,t.job,t.project,t.period,t.status,t.invoice,...currencies,t.source,t.sourceRows,t.observation]];for(const p of timeline.projects)for(const o of p.observations){const join=c=>[...new Set(o.rows.map(r=>r.values[c]??'∅'))].join(' / '),row=[join(3),join(6),p.job,p.project,o.period,o.status,o.invoice];for(const c of currencies)row.push(o.amounts[c].exact!==null?{numeric:true,value:o.amounts[c].exact}:o.rows.length?o.amounts[c].text:'');row.push(o.snapshot?o.snapshot.filename:'',o.rows.map(r=>r.row).join(', '),p.review&&o.kind==='present'?t.review:t[o.kind]);rows.push(row);}const blob=new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='DIAM-continuity-filtered.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
for(const id of ['statusNote','timelineNote','amountNote'])$(id).textContent=t[id];$('title').textContent=t.historyPage;$('matrixTitle').textContent=t.historyPage;$('sourceTitle').textContent=t.sourceRows;$('version').textContent='v'+data.version;$('download').textContent=t.downloadCsv;render();
</script></body></html>
